<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- The CalcQuest docs moved to https://calcquest.app/docs. This page is what the
       old GitHub Pages site (arinagr.me/calcquest-docs) serves; it sends every old
       link, including docsify #/ links, to the matching new page. -->
  <title>CalcQuest Docs have moved to calcquest.app/docs</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="The CalcQuest documentation now lives at calcquest.app/docs.">
  <meta name="robots" content="noindex, follow">
  <link rel="canonical" href="https://calcquest.app/docs">
  <script>
    (function () {
      var base = 'https://calcquest.app/docs/';
      var h = location.hash;
      var t = '';
      if (h.indexOf('#/') === 0) {
        var p = h.slice(2).split('?')[0].replace(/\.md$/, '').replace(/^\/+|\/+$/g, '');
        var m = { '01_overview/keywords': 'who-is-it-for', 'use-cases': 'who-is-it-for',
                  '02_gameplay/puzzle-types': 'games/', '02_gameplay/difficulty-scaling': 'gameplay/difficulty', 'README': '' };
        t = (p in m) ? m[p] : p.replace(/^0\d_/, '');
      }
      location.replace(base + t);
    })();
  </script>
  <meta http-equiv="refresh" content="0; url=https://calcquest.app/docs">
  <style>body{font-family:system-ui,sans-serif;background:#fff;color:#1E1B18;margin:0;padding:48px 16px;text-align:center}a{color:#1E1B18}</style>
</head>
<body>
  <p>The CalcQuest documentation has moved to <a href="https://calcquest.app/docs">calcquest.app/docs</a>.</p>
</body>
</html>
