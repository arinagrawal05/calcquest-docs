<!-- index.html -->
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="CalcQuest documentation - an indie mobile math puzzle game where players use a calculator to solve creative brain-teasing puzzles.">
  <meta name="keywords"
    content="CalcQuest, calculator game, math puzzle, brain teaser, mobile game, Flutter game, indie game">
  <meta name="author" content="Arin Agrawal">
  <meta name="robots" content="index, follow">
  <title>CalcQuest Documentation</title>

  <!-- Open Graph / Social -->
  <meta property="og:title" content="CalcQuest Documentation">
  <meta property="og:description" content="Documentation for CalcQuest - an indie mobile math puzzle game.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://arinagrawal05.github.io/calcquest-docs/">

  <!-- Docsify Dark Theme -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-darklight-theme@latest/dist/style.min.css">

  <style>
    :root {
      --base-font-size: 16px;
      --theme-color: #42b983;

      /* Dark theme as default */
      --background: #1e1e1e;
      --text-color: #e0e0e0;
      --sidebar-background: #252525;
      --sidebar-color: #b0b0b0;
      --code-background: #2d2d2d;
      --blockquote-background: #2d2d2d;
    }

    body {
      background-color: #1e1e1e;
      color: #e0e0e0;
    }

    .sidebar {
      background-color: #252525 !important;
      border-right: 1px solid #333;
    }

    .sidebar-nav a {
      color: #b0b0b0 !important;
    }

    .sidebar-nav a:hover,
    .sidebar-nav a.active {
      color: #42b983 !important;
    }

    .markdown-section {
      background-color: #1e1e1e !important;
      color: #e0e0e0 !important;
    }

    .markdown-section h1,
    .markdown-section h2,
    .markdown-section h3,
    .markdown-section h4,
    .markdown-section h5,
    .markdown-section h6 {
      color: #ffffff !important;
    }

    .markdown-section a {
      color: #42b983 !important;
    }

    .markdown-section code {
      background-color: #2d2d2d !important;
      color: #e06c75 !important;
    }

    .markdown-section pre {
      background-color: #2d2d2d !important;
    }

    .markdown-section pre code {
      color: #abb2bf !important;
    }

    .markdown-section blockquote {
      background-color: #2d2d2d !important;
      border-left: 4px solid #42b983 !important;
      color: #b0b0b0 !important;
      padding: 10px 15px !important;
      margin: 1em 0 !important;
    }

    .markdown-section table th,
    .markdown-section table td {
      border-color: #444 !important;
    }

    .markdown-section table th {
      background-color: #333 !important;
    }

    .markdown-section table tr:nth-child(2n) {
      background-color: #252525 !important;
    }

    .search input {
      background-color: #2d2d2d !important;
      color: #e0e0e0 !important;
      border-color: #444 !important;
    }

    .search .matching-post {
      background-color: #2d2d2d !important;
      border-color: #444 !important;
    }

    .app-nav {
      background-color: #1e1e1e !important;
    }

    /* GitHub corner */
    .github-corner svg {
      fill: #42b983 !important;
      color: #1e1e1e !important;
    }

    /* Scrollbar styling */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #1e1e1e;
    }

    ::-webkit-scrollbar-thumb {
      background: #444;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #555;
    }

    /* Store badges */
    .store-badges {
      display: flex;
      gap: 15px;
      margin: 20px 0;
      flex-wrap: wrap;
    }

    .store-badges img {
      height: 50px;
      width: auto;
    }

    /* Twitter embeds dark background */
    .twitter-tweet {
      margin: 1em 0 !important;
    }

    /* Strong/bold text */
    .markdown-section strong {
      color: #ffffff !important;
    }

    /* Horizontal rule */
    .markdown-section hr {
      border-color: #444 !important;
    }
  </style>
</head>

<body>
  <div id="app">Loading...</div>

  <script>
    window.$docsify = {
      name: 'CalcQuest',
      repo: 'https://github.com/arinagrawal05/calcquest-docs',
      loadSidebar: true,
      subMaxLevel: 2,
      auto2top: true,
      search: 'auto',
      routerMode: 'hash',
      notFoundPage: true,
      homepage: 'README.md',
      alias: {
        '/.*/_sidebar.md': '/_sidebar.md'
      }
    }
  </script>

  <!-- Docsify Core -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>

  <!-- Search Plugin -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>

  <!-- Twitter Widget for embedded tweets -->
  <script async src="https://platform.twitter.com/widgets.js" charset="utf-8"></script>
</body>

</html>
